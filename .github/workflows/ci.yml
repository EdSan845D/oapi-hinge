name: CI

on:
  push:
    branches: [main, alpha]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # 根模块（内核 hinge / 生成器 / 文档生成器 openapi）：零框架依赖
      # openapi 包按需 import 即隔离：不引用即不链接，测试默认覆盖
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # example 独立模块：程序化 EntryPoints 生成 + 门禁（该场景 CLI 已禁止，走项目内入口）
      - name: Example (programmatic entrypoint)
        run: |
          cd example
          go build ./...
          go run ./app -check

      # 脚手架可用性冒烟：生成项目并用仓库自身构建的 hinge CLI 生成 apigen 后编译
      # （不用发布版 CLI：gen 行为以仓库 HEAD 为准）GOWORK=off：myapp 不在仓库工作区内
      - name: Scaffold smoke
        run: |
          go build -o /tmp/hinge ./cmd/hinge
          go run ./scaffold create myapp --no-tidy
          (cd myapp && GOWORK=off go mod edit -replace github.com/EdSan845D/oapi-hinge=.. )
          (cd myapp && GOWORK=off go mod edit -replace github.com/EdSan845D/oapi-hinge/servergin=../servergin )
          (cd myapp && GOWORK=off go mod edit -replace github.com/EdSan845D/oapi-hinge/validator=../validator )
          (cd myapp && GOWORK=off /tmp/hinge gen)
          (cd myapp && GOWORK=off go mod tidy)
          (cd myapp && GOWORK=off go build ./...)
          (cd myapp && GOWORK=off go run ./docs -out openapi.yaml)

      # 适配器子模块：独立 go.mod（gin / echo 依赖只存在于各自模块）
      - name: Adapters (servergin / serverecho / serverhttp)
        run: |
          cd servergin  && go build ./... && go vet ./... && go test ./...
          cd ../serverecho && go build ./... && go vet ./... && go test ./...
          cd ../serverhttp && go build ./... && go vet ./... && go test ./...
          cd ../validator  && go build ./... && go vet ./...
