name: CI

on:
  push:
    branches: [main, alpha]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # 默认构建（release 语义，不含 openapi 包）
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # 文档生成器（必须带 tag）
      - name: Build (openapi tag)
        run: go build -tags openapi ./...

      - name: Vet (openapi tag)
        run: go vet -tags openapi ./...

      - name: Test (openapi tag)
        run: go test -tags openapi ./...

      # example 独立模块：程序化 EntryPoints 生成 + 门禁（CLI 已禁止该场景，见 P0-1）
      - name: Example (programmatic entrypoint)
        run: |
          cd example
          go build ./...
          go run ./app -check
          go build -tags openapi ./...

      # 脚手架可用性冒烟：生成项目并编译（不跑 tidy，依赖版本以 tag 发布后为准）
      - name: Scaffold smoke
        run: |
          go run ./scaffold create myapp --no-tidy
          (cd myapp && go mod edit -replace github.com/EdSan845D/oapi-hinge=.. )
          (cd myapp && go mod tidy)
          (cd myapp && go build ./...)
